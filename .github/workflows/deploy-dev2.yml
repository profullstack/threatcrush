# Ship every merge to dev2, where threatcrush.com runs.
#
# dev2 never compiles anything. The `image` job builds the Dockerfile here on GitHub's
# runner and pushes ghcr.io/profullstack/threatcrush-web:<full commit sha> (a separate
# package from ghcr.io/profullstack/threatcrush, the self-host image published on tags).
# The `deploy` job runs /home/anthony/www/threatcrush.com/deploy-app.sh <sha> over ssh:
# with IMAGE_REPO in its deploy.env the box only `docker pull`s that tag and runs
# `compose up -d --no-build` (standby, health check, rollback unchanged). A missing tag
# stops the deploy with an error; it never falls back to a local build.
#
# Pull auth: this job's short-lived GITHUB_TOKEN (packages: read) goes to the box on
# ssh stdin, is used once with a throwaway DOCKER_CONFIG and is never stored.
#
# The image holds no secrets: no build args, .env* is in .dockerignore, and app.env
# is mounted on dev2 at run time. Same pattern as profullstack/c0mpute #489.
name: Deploy to dev2

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (commit id or vX.Y.Z; defaults to the branch head)
        required: false
        type: string
      deploy:
        description: Deploy to dev2 after the image is pushed (false = build and push only)
        required: false
        type: boolean
        default: true

# One deploying run at a time; a newer push replaces a pending one, so an older
# build can never deploy over a newer one. A build-only dispatch (deploy=false)
# stays out of that queue.
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.deploy) && 'deploy-dev2' || format('threatcrush-web-image-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/profullstack/threatcrush-web

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      # ${{ }} values go through env, never straight into a run: body.
      - name: Check the requested ref
        env:
          REF: ${{ inputs.ref || github.sha }}
        # The sha ends up on the box's command line, so anything but a commit id
        # or a release tag is refused here.
        shell: bash
        run: |
          if ! [[ "$REF" =~ ^([0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::ref must be a commit id (7-40 hex) or a release tag (vX.Y.Z)" >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve the full commit id
        id: rev
        run: |
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve a commit id" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building $IMAGE:$sha"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A redeploy or rollback of a sha that was already built pushes nothing new.
      - name: Already built?
        id: have
        env:
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$SHA" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"; echo "$IMAGE:$SHA already in the registry"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner disk
        if: steps.have.outputs.built != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.built != 'true'

      # No secrets go into this build: the only build args are public values,
      # .env* is not in the context, and app.env is mounted on dev2 at run time.
      - name: Build and push
        if: steps.have.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.rev.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.url=https://threatcrush.com
            org.opencontainers.image.title=threatcrush.com web
          # Layer cache in the Actions cache (not artifacts, not GHCR storage).
          cache-from: type=gha,scope=threatcrush-web
          cache-to: type=gha,scope=threatcrush-web,mode=max

      - name: Smoke test the image
        if: steps.have.outputs.built != 'true'
        env:
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          docker pull -q "$IMAGE:$SHA"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$SHA")" = "$SHA"
          # The standalone server and the CLI installer (threatcrush.com/install.sh) ship in it.
          docker run --rm --entrypoint sh "$IMAGE:$SHA" -c 'test -f apps/web/server.js && test -s apps/web/public/install.sh'

      # Keep the registry small: the newest 15 builds are plenty for rollbacks.
      - name: Prune old images
        if: steps.have.outputs.built != 'true'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: threatcrush-web
          package-type: container
          min-versions-to-keep: 15

  deploy:
    needs: image
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up ssh
        env:
          SSH_KEY: ${{ secrets.DEV2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The token rides stdin (never argv, never a file on the box); deploy-app.sh
      # reads one line before it queues for a deploy slot.
      - name: Deploy (pull the prebuilt image)
        env:
          DEV2_USER: ${{ secrets.DEV2_USER }}
          DEV2_HOST: ${{ secrets.DEV2_HOST }}
          SHA: ${{ needs.image.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$DEV2_USER@$DEV2_HOST" \
            /home/anthony/www/threatcrush.com/deploy-app.sh "$SHA"

      - name: Verify the site answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://threatcrush.com/" || true)
            case "$code" in 2*|3*|401|403) echo "threatcrush.com $code"; exit 0;; esac
            echo "attempt $i: $code"; sleep 10
          done
          echo "threatcrush.com never answered"; exit 1
