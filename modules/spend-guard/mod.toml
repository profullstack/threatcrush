[module]
name = "spend-guard"
version = "0.4.0"
description = "Detects balance-drain attacks on metered third-party services — SMS pumping, toll fraud, and runaway API spend"
author = "Profullstack, Inc."
license = "MIT"
homepage = "https://github.com/profullstack/threatcrush/tree/master/modules/spend-guard"

[module.pricing]
type = "free"

[module.requirements]
threatcrush = ">=0.2.0"
os = ["linux", "darwin"]
capabilities = ["network:outbound"]

[module.config.defaults]
enabled = true

# How often to poll provider billing APIs (seconds). Detection latency is
# bounded below by the provider's own reporting lag, so polling faster than
# ~5min buys little.
poll_interval_seconds = 900

# Days of usage history to pull each poll. Also the window the baseline is
# learned from.
lookback_days = 14

# Clean days required before any rule may fire. Prevents alerting from an
# unlearned baseline on a fresh install.
warmup_samples = 7

# --- Detection thresholds -------------------------------------------------
# Unit cost multiple over baseline. The economic signature of pumping: the
# attacker's revenue share IS the price premium, so it cannot be hidden.
unit_cost_factor = 5.0

# Daily volume multiple over baseline. This is what separates a pumping run
# from organic growth into a new, expensive market.
volume_factor = 10.0

# Ignore days below this spend — noise floor for low-volume accounts.
min_daily_spend = 1.0

# Independent detectors that must agree before containment is recommended.
# Keep at 2 or higher: a lone elevated unit cost is a legitimate international
# user often enough that acting on it alone would block real customers.
contain_signals = 2

# --- Balance ---------------------------------------------------------------
# Alert when the balance would hit zero within this many hours.
burn_rate_warn_hours = 6

# Assert whether the provider will auto-top-up from a stored card. Most
# providers do not expose this over an API. Set true and the burn-rate alert
# escalates to critical, because with auto-recharge on there is no spend
# ceiling — the attack becomes an open credit line rather than a bounded loss.
auto_recharge_enabled = false

# --- Containment (optional) ------------------------------------------------
# POSTed a JSON body when enough signals agree, so your app can trip its own
# breaker (disable OTP sends, switch providers, page someone). Left empty,
# spend-guard only alerts.
circuit_breaker_webhook = ""

# --- Providers -------------------------------------------------------------
# Read-only credentials. Prefer env interpolation over literals here.
twilio_account_sid = ""
twilio_auth_token = ""

# Alchemy has NO billing or usage API — compute-unit spend is dashboard-only.
# So this connector monitors QUOTA STATE, not spend: it makes one cheap
# eth_blockNumber call per poll and alerts critically when the monthly capacity
# limit is hit, which is simultaneously a billing event and an outage (every
# app on that key starts failing).
#
# List one entry per app. A single Alchemy key is often shared across several
# services, and the label is what tells you which one to look at.
#
# alchemy_rpc_urls = [
#   { label = "b1dz-base", url = "${BASE_RPC_URL}" },
#   { label = "payments-btc", url = "${BITCOIN_RPC_URL}" },
# ]
alchemy_rpc_urls = []

# --- Credit/quota providers ------------------------------------------------
# The generic drain detector. Most metered SaaS exposes credits-remaining to
# the SAME key the app already deploys, so this needs no admin credential and
# no billing API — which is what makes broad coverage practical.
#
# Detection is pace-based: quota consumed vs billing period elapsed. Burning
# 80% of the month in the first 20% is anomalous whether the units are search
# credits, TTS characters or compute units. A plain low-balance alarm only
# fires after the money is gone; pace fires while it is going.
#
# quota_providers = [
#   { provider = "valueserp",  api_key = "${VALUESERP_API_KEY}",  label = "valueserp" },
#   { provider = "elevenlabs", api_key = "${ELEVENLABS_API_KEY}", label = "elevenlabs" },
# ]
quota_providers = []

# Flag when consumption runs this many times ahead of schedule.
quota_pace_factor = 2.0

# --- Prepaid balance providers ---------------------------------------------
# For services that expose a bare credit balance with no limit and no reset
# date. Pace is undefined there, so detection watches the drawdown slope
# between polls and projects time-to-zero. Also readable with the ordinary
# app key.
#
# Moonshot/Kimi: keys are region-bound. A key issued for api.moonshot.ai
# returns 401 on api.moonshot.cn and vice versa, which looks identical to a
# revoked credential — set `host` explicitly if you are not on .ai.
#
# balance_providers = [
#   { provider = "deepseek", api_key = "${DEEPSEEK_API_KEY}", label = "deepseek" },
#   { provider = "moonshot", api_key = "${MOONSHOT_API_KEY}", label = "moonshot",
#     host = "https://api.moonshot.ai" },
# ]
balance_providers = []
