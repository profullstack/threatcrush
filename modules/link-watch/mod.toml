[module]
name = "link-watch"
version = "0.1.0"
description = "Crawls your sites and reports broken links and assets (404s, 5xx, dead hosts)"
author = "Profullstack, Inc."
license = "SEE LICENSE IN LICENSE"
homepage = "https://threatcrush.com/link-watch"

[module.pricing]
type = "paid"
url = "https://threatcrush.com/link-watch"

[module.requirements]
threatcrush = ">=0.13.0"
os = ["linux", "darwin", "win32"]
capabilities = ["network:outbound"]

[module.config.defaults]
enabled = true
sites = []
interval_hours = 24
max_pages = 200
max_links = 2000
check_external = true
timeout_ms = 10000
concurrency = 6
ignore_paths = []
api_url = "https://threatcrush.com"
