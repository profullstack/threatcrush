# ThreatCrush Self-Hosting Package (PRD 15)
# Usage: docker compose up -d
# Docs: docs/SELF_HOSTING.md

version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    volumes:
      - web_data:/app/data

  # Optional: PostgreSQL for self-hosters not using Supabase
  # Uncomment to use a local database instead of Supabase
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: threatcrush
  #     POSTGRES_USER: ${DB_USER:-threatcrush}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #     - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-threatcrush}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  web_data:
