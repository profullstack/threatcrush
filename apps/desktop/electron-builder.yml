appId: com.threatcrush.desktop
productName: ThreatCrush
publish: []
# Desktop has no native modules — skip rebuild to avoid pnpm symlink issues.
npmRebuild: false
buildDependenciesFromSource: false
directories:
  buildResources: resources
  output: release
files:
  - 'out/**/*'
  - 'package.json'
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
asarUnpack:
  - resources/**
linux:
  executableName: threatcrush-desktop
  artifactName: threatcrush-desktop-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
  maintainer: profullstack
  category: Utility
  desktop:
    Name: ThreatCrush
    StartupWMClass: ThreatCrush
deb:
  # Both scripts *replace* electron-builder's stock templates rather than
  # extending them, so they re-implement the update-alternatives, mime and
  # desktop-database steps verbatim. They exist to fix the sandbox setup, which
  # the stock postinst gets wrong on Ubuntu 24.04+ — see the comment in
  # after-install.sh. Re-check both against app-builder-lib's templates when
  # bumping electron-builder.
  afterInstall: resources/after-install.sh
  afterRemove: resources/after-remove.sh
mac:
  target:
    - dmg
    - zip
  notarize: false
  artifactName: threatcrush-desktop-${version}-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: threatcrush-desktop-${version}-${arch}-setup.${ext}
nsis:
  shortcutName: ThreatCrush
  uninstallDisplayName: ThreatCrush
  createDesktopShortcut: always
