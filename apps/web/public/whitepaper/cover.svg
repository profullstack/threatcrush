<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b09"/>
      <stop offset="60%" stop-color="#0a0f0c"/>
      <stop offset="100%" stop-color="#050807"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff88" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#grid)"/>
  <rect width="1200" height="1600" fill="url(#orb1)"/>
  <rect width="1200" height="1600" fill="url(#orb2)"/>

  <!-- Top corner bracket -->
  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 80 80 L 80 160 M 80 80 L 160 80"/>
    <path d="M 1120 80 L 1120 160 M 1120 80 L 1040 80"/>
    <path d="M 80 1520 L 80 1440 M 80 1520 L 160 1520"/>
    <path d="M 1120 1520 L 1120 1440 M 1120 1520 L 1040 1520"/>
  </g>

  <!-- Matrix-style noise columns -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#00ff88" opacity="0.10" font-size="14">
    <text x="120" y="280">01101100 11010110 10110011</text>
    <text x="120" y="300">CVE-2026-1042  KEV  EPSS:0.94</text>
    <text x="120" y="320">scan tcp/* 0.0.0.0  iface=eth0</text>
    <text x="120" y="340">payload= "A&apos;OR 1=1 --"  blocked=true</text>
    <text x="120" y="360">honeypot trap fingerprint=0x9af1</text>
    <text x="120" y="380">tar-pit drain=4.2KB/s peers=37</text>

    <text x="780" y="1200">module: ctem.discover.asm</text>
    <text x="780" y="1220">priority = exploit * reach * blast</text>
    <text x="780" y="1240">validate exploit -&gt; ok</text>
    <text x="780" y="1260">mobilize alert=slack,sms,webhook</text>
    <text x="780" y="1280">cycle=closed  mttm=06:14</text>
  </g>

  <!-- Logo / brand mark -->
  <g transform="translate(120, 200)" filter="url(#glow-soft)">
    <text font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#00ff88" letter-spacing="6">▣ THREATCRUSH</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(120, 540)">
    <rect x="0" y="0" width="280" height="40" rx="20" fill="none" stroke="#00ff88" stroke-opacity="0.4"/>
    <text x="140" y="26" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#00ff88" text-anchor="middle" letter-spacing="3">// PRACTICAL GUIDE</text>
  </g>

  <!-- Title -->
  <g transform="translate(120, 640)" filter="url(#glow)">
    <text font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="92" fill="#ffffff">From Vulnerability</text>
    <text y="110" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="92" fill="#ffffff">Management to</text>
    <text y="220" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="92" fill="#00ff88">Continuous Threat</text>
    <text y="330" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="92" fill="#00ff88">Exposure Management</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(120, 1080)">
    <text font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="30" fill="#b8c5be">A 90-day operator playbook for evolving from</text>
    <text y="44" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="30" fill="#b8c5be">scan-and-ticket VM into a real CTEM loop —</text>
    <text y="88" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="30" fill="#b8c5be">without buying nine more tools.</text>
  </g>

  <!-- Divider -->
  <line x1="120" y1="1280" x2="320" y2="1280" stroke="#00ff88" stroke-width="2"/>

  <!-- Bullets -->
  <g transform="translate(120, 1320)" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#9aa5a0">
    <text>● The 5 stages of CTEM in operator language</text>
    <text y="34">● Why CVSS-weighted backlogs lie to you</text>
    <text y="68">● A 90-day implementation playbook</text>
    <text y="102">● Metrics that reward outcomes, not activity</text>
  </g>

  <!-- Footer -->
  <g transform="translate(120, 1500)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#5a6660">
    <text>threatcrush.com  ·  hello@threatcrush.com  ·  2026 edition</text>
  </g>
</svg>
